services:
  - type: web
    name: shfaim-shuttle-finder
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python scripts/fetch_lines.py --api-only
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEOCODER
        value: photon
      - key: SERPAPI_API_KEY
        sync: false